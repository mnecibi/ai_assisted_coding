spring:
  datasource:
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
  ai:
    mcp:
      server:
        name: actuator-mcp
        version: 0.0.1
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /actuator-mcp

management:
  endpoints:
    web:
      exposure:
        include: "*"
